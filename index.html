        .category-section.sweet .category-title { border-color: var(--accent-sweet); }

            gap: 12px;

        .label-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            aspect-ratio: 3 / 4;
            display: flex;
            align-items: center;
            justify-content: center;

            height: 100%;

            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);

            margin: 0 0 5px 0;

        }

        .modal-thumb {
            width: 70px;
            height: 90px;
            object-fit: cover;
            border-radius: 4px;

            border-bottom: 1px solid #333;
            padding-bottom: 2px;

        .spec-label {
            color: #aaa;

            font-weight: bold;
            color: #fff;

        function initMenu() {
            const lines = rawData.trim().split('\n');
            lines.forEach(line => {
                const cols = line.split('\t');
                if (cols.length < 15) return;
                const item = {
                    category: cols[0], name: cols[1], pref: cols[2], typeName: cols[3],
                    rice: cols[4], polish: cols[5], alc: cols[6], smv: cols[7],
                    taste: cols[8], comment: cols[9], priceHalf: cols[10],
                    priceFull: cols[11], priceBottle: cols[12], display: cols[13],
                    imgUrl: cols[14]
                };
                
                if (item.display !== 'ON') return;

                const card = document.createElement('div');
                card.className = 'label-card';
                card.onclick = () => openModal(item);
                const img = document.createElement('img');
                img.src = item.imgUrl;
                img.alt = item.name;
                card.appendChild(img);

                if (item.taste.includes('辛口')) {
                    document.getElementById('grid-dry').appendChild(card);
                } else if (item.taste.includes('甘口')) {
                    document.getElementById('grid-sweet').appendChild(card);
                } else {
                    document.getElementById('grid-other').appendChild(card);
                }
            });
        }

        function openModal(item) {
            document.getElementById('m-name').innerText = item.name;
            document.getElementById('m-category').innerText = `カテゴリー：${item.category}`;
            document.getElementById('m-meta').innerText = `${item.pref} / ${item.typeName === '-' ? 'スペック非公開' : item.typeName}`;
            document.getElementById('m-thumb').src = item.imgUrl;
            
            document.getElementById('s-rice').innerText = item.rice === '-' ? '非公開' : item.rice;
            document.getElementById('s-polish').innerText = item.polish === '-' ? '非公開' : item.polish;
            document.getElementById('s-alc').innerText = item.alc === '-' ? '非公開' : item.alc;
            document.getElementById('s-smv').innerText = item.smv === '-' ? '非公開' : item.smv;

            document.getElementById('m-comment').innerText = item.comment;
            document.getElementById('p-half').innerText = item.priceHalf;
            document.getElementById('p-full').innerText = item.priceFull;
            document.getElementById('p-bottle').innerText = item.priceBottle;
            document.getElementById('detail-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.remove('active');
        }

        window.onload = initMenu;
    </script>
</body>
</html>
